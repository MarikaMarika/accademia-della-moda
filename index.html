<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Accademia di Moda</title>
<style>
:root{--wine:#522f43;--pink:#e75d87;--pale:#fff4f7;--green:#8fd3ab;--shadow:0 12px 32px rgba(97,53,74,.10)}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#fff8fa,#fffdf9);color:var(--wine);font-family:Arial,Helvetica,sans-serif}
button{font:inherit} .shell{max-width:1180px;margin:auto;padding:18px}
.top{display:flex;align-items:center;gap:18px;background:#fff;border:2px solid #f5dce4;border-radius:28px;padding:16px 22px;box-shadow:var(--shadow);position:sticky;top:8px;z-index:20}
.bow{font-size:52px}.title h1{margin:0;font-family:Georgia,serif;font-size:30px}.title div{font-weight:800;color:#9b6077}
.homebtn{margin-left:auto;border:0;background:#fff0f5;border-radius:18px;padding:12px 17px;font-weight:900;font-size:18px;cursor:pointer}
.hero{margin-top:18px;background:linear-gradient(120deg,#f9dbe7,#f7ebf6 48%,#fff0da);border:2px solid #f2d6e0;border-radius:34px;padding:34px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"🎀  ✂️  👗  🧵";position:absolute;right:30px;bottom:24px;font-size:40px;letter-spacing:8px}
.hero .eyebrow{font-size:18px;font-weight:900;color:#a65f7b;letter-spacing:1px}.hero h2{font:700 44px Georgia,serif;margin:8px 0 12px}.hero p{font-size:22px;line-height:1.4;font-weight:700;max-width:700px}
.progressCard{margin-top:20px;background:#fff;border:2px solid #f3dce4;border-radius:28px;padding:22px;box-shadow:var(--shadow)}
.progressTop{display:flex;justify-content:space-between;gap:12px;font-size:21px;font-weight:900}.bar{height:16px;background:#f5e8ee;border-radius:99px;overflow:hidden;margin-top:15px}.fill{height:100%;background:linear-gradient(90deg,#e75d87,#bf89b3);width:0}
.module{margin-top:28px}.module h2{font-size:28px}.lessonGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
.lessonCard{background:#fff;border:2px solid #f3dce4;border-radius:28px;padding:22px;box-shadow:var(--shadow)}
.lessonCard h3{font-size:22px;margin:8px 0}.lessonCard p{font-size:17px;font-weight:700;line-height:1.4;color:#7f6673}
.status{display:inline-block;padding:8px 12px;border-radius:999px;background:#fff1f5;font-weight:900}
.primary{border:0;border-radius:20px;background:linear-gradient(135deg,#e75d87,#bf89b3);color:white;padding:15px 22px;font-size:20px;font-weight:1000;cursor:pointer}
.lesson{display:none}.lessonHead{margin-top:18px;background:linear-gradient(120deg,#fff,#fff4f7);border:2px solid #f3d7e0;border-radius:30px;padding:25px;text-align:center;box-shadow:var(--shadow)}
.lessonHead .tag{font-weight:900;color:#d84f79}.lessonHead h2{font:700 42px Georgia,serif;margin:9px 0}.lessonHead p{font-size:22px;font-weight:700;margin:0}
.steps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}.stepPill{padding:9px 13px;border-radius:999px;background:#f8eef2;font-weight:900;color:#8b7480}.stepPill.on{background:#e75d87;color:#fff}.stepPill.done{background:#dff3e7;color:#3d6d50}
.card{margin-top:18px;background:#fff;border:2px solid #f4dce4;border-radius:30px;padding:28px;box-shadow:var(--shadow)}.card h3{font-size:30px;margin:0 0 8px}.card p{font-size:23px;line-height:1.4;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:22px}.grid.two{grid-template-columns:repeat(2,1fr)}
.option{border:4px solid white;border-radius:28px;padding:22px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;box-shadow:var(--shadow);transition:.15s}
.option:hover{transform:translateY(-3px)}.label{font-size:24px;font-weight:1000;margin-top:14px;text-align:center}.emoji{font-size:82px;line-height:1.1}.combo{font-size:58px;line-height:1.1}.word{font-size:32px;font-weight:1000}
.bg-pink{background:#f6c0d3}.bg-blue{background:#b8def6}.bg-yellow{background:#f9e476}.bg-red{background:#f5b7bd}.bg-orange{background:#f8cf9d}.bg-purple{background:#d9c7ee}.bg-neutral{background:#f6eef2}
.garment{position:relative;width:120px;height:150px;margin:auto}.dress-top{position:absolute;left:36px;top:8px;width:48px;height:58px;border-radius:15px 15px 5px 5px}.dress-top:before,.dress-top:after{content:"";position:absolute;top:-8px;width:14px;height:48px;border-radius:10px}.dress-top:before{left:-5px;transform:rotate(-8deg)}.dress-top:after{right:-5px;transform:rotate(8deg)}.skirt{position:absolute;left:16px;top:55px;width:88px;height:90px;clip-path:polygon(35% 0,65% 0,100% 100%,0 100%);border-radius:0 0 22px 22px}
.pinkG .dress-top,.pinkG .dress-top:before,.pinkG .dress-top:after,.pinkG .skirt{background:#e85c91}.blueG .dress-top,.blueG .dress-top:before,.blueG .dress-top:after,.blueG .skirt{background:#5aa9e6}.yellowG .dress-top,.yellowG .dress-top:before,.yellowG .dress-top:after,.yellowG .skirt{background:#edbd24}.redG .dress-top,.redG .dress-top:before,.redG .dress-top:after,.redG .skirt{background:#e44f5f}.orangeG .dress-top,.orangeG .dress-top:before,.orangeG .dress-top:after,.orangeG .skirt{background:#ef9f4c}.purpleG .dress-top,.purpleG .dress-top:before,.purpleG .dress-top:after,.purpleG .skirt{background:#9d78cf}
.swatch{width:90px;height:90px;border-radius:24px;border:5px solid white;box-shadow:var(--shadow)}.swatch.pink{background:#e85c91}.swatch.blue{background:#5aa9e6}.swatch.yellow{background:#edbd24}.swatch.red{background:#e44f5f}.swatch.orange{background:#ef9f4c}.swatch.purple{background:#9d78cf}.swatch.black{background:#222}
.pattern{width:120px;height:120px;border-radius:24px;border:5px solid #fff;box-shadow:var(--shadow)}.stripes{background:repeating-linear-gradient(90deg,#f6c0d3 0 18px,#fff 18px 34px)}.dots{background-color:#fff0f5;background-image:radial-gradient(#e75d87 18%,transparent 20%);background-size:34px 34px}.flowers{background-color:#fff7e7;background-image:radial-gradient(circle at 50% 40%,#f7b5ca 0 9px,transparent 10px),radial-gradient(circle at 35% 55%,#f7b5ca 0 9px,transparent 10px),radial-gradient(circle at 65% 55%,#f7b5ca 0 9px,transparent 10px);background-size:55px 55px}
.option:disabled{cursor:default;opacity:1}.correctMsg{display:none;margin:24px auto 0;max-width:540px;text-align:center;background:#dff3e7;border:3px solid #8fd3ab;border-radius:24px;padding:18px 22px;font-size:30px;font-weight:1000;color:#356847;animation:pop .25s ease-out}@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}.help{display:none;margin-top:20px;background:#fff5d9;border:2px solid #f1d99b;border-radius:20px;padding:17px;font-size:21px;font-weight:900}.ok{outline:5px solid var(--green)!important}
.next{display:none;margin:25px auto 0;border:0;border-radius:22px;background:linear-gradient(135deg,#e75d87,#c889b4);color:white;padding:16px 30px;font-size:22px;font-weight:1000;cursor:pointer}
.doneBox{text-align:center;background:linear-gradient(135deg,#e5f6eb,#fff3d7);border-radius:30px;padding:34px;box-shadow:var(--shadow)}.doneBox .medal{font-size:90px}.doneBox h3{font:700 38px Georgia,serif}.badge{font-size:22px;font-weight:1000}
@media(max-width:760px){.lessonGrid,.grid,.grid.two{grid-template-columns:1fr}.option{min-height:200px}.lessonHead h2{font-size:34px}.card{padding:20px 14px}.hero{padding-bottom:95px}}

/* ===== TABLET LARGE-TEXT MODE ===== */
html{-webkit-text-size-adjust:100%}
body{font-size:clamp(22px,2.2vw,30px)}
.shell{max-width:1280px;padding:clamp(14px,2vw,28px)}

.hero{padding:clamp(28px,4vw,50px)}
.hero .eyebrow{font-size:clamp(20px,2.5vw,30px)}
.hero h2{font-size:clamp(42px,6vw,70px);line-height:1.03}

.lessonCard h3{font-size:clamp(27px,3.2vw,38px);line-height:1.12;overflow-wrap:anywhere}
.lessonCard p{font-size:clamp(22px,2.6vw,31px);line-height:1.28}

.combo{font-size:clamp(60px,8vw,100px)}

.doneBox .medal{font-size:clamp(90px,12vw,140px)}

@media(max-width:900px){
 .hero:after{font-size:32px;right:20px}

 .grid.two{grid-template-columns:repeat(2,1fr)}
 .option{min-height:260px}
}
@media(max-width:700px){
 .top{align-items:flex-start;flex-wrap:wrap}
 .homebtn{margin-left:0;width:100%}
 .hero{padding-bottom:105px}
 .grid,.grid.two{grid-template-columns:1fr}
 .option{min-height:230px}

/* ===== HOME EXTRA LARGE + LESSON COMPACT TABLET ===== */

/* HOME: ancora più grande */
#home .hero .eyebrow{
  font-size:clamp(24px,3vw,34px);
}
#home .hero h2{
  font-size:clamp(50px,7vw,82px);
  line-height:1;
}
#home .hero p{
  font-size:clamp(30px,4vw,46px);
  line-height:1.18;
}
#home .progressTop{
  font-size:clamp(26px,3vw,36px);
}
#home .module h2{
  font-size:clamp(36px,4.7vw,54px);
}
#home .lessonCard h3{
  font-size:clamp(31px,3.8vw,44px);
  line-height:1.08;
}
#home .lessonCard p{
  font-size:clamp(25px,3vw,34px);
  line-height:1.18;
}
#home .status{
  font-size:clamp(21px,2.5vw,29px);
}
#home .primary{
  font-size:clamp(25px,3vw,34px);
}

/* LEZIONI: layout verticale più compatto */
#lesson .lessonHead{
  padding:16px 20px 14px;
  margin-top:10px;
  border-radius:24px;
}
#lesson .lessonHead .tag{
  font-size:clamp(18px,2vw,24px);
}
#lesson .lessonHead h2{
  font-size:clamp(36px,4.8vw,54px);
  line-height:1;
  margin:5px 0 6px;
}
#lesson .lessonHead p{
  font-size:clamp(22px,2.7vw,31px);
  line-height:1.12;
}
#lesson .steps{
  margin-top:10px;
  gap:6px;
}
#lesson .stepPill{
  font-size:clamp(17px,1.8vw,22px);
  padding:6px 10px;
}

/* card esercizio compatta */
#lesson .card{
  margin-top:10px;
  padding:16px 18px;
  border-radius:24px;
}
#lesson .card h3{
  font-size:clamp(30px,3.8vw,42px);
  line-height:1.04;
  margin-bottom:4px;
}
#lesson .card p{
  font-size:clamp(25px,3vw,34px);
  line-height:1.12;
  margin:4px 0 8px;
}

/* meno spazio e card-risposta più basse */
#lesson .grid{
  gap:12px;
  margin-top:10px;
}
#lesson .option{
  min-height:165px;
  padding:12px;
  border-radius:22px;
}
#lesson .label{
  font-size:clamp(24px,2.9vw,32px);
  line-height:1.03;
  margin-top:8px;
}
#lesson .emoji{
  font-size:clamp(62px,7.5vw,90px);
}
#lesson .combo{
  font-size:clamp(46px,6vw,72px);
}
#lesson .word{
  font-size:clamp(28px,3.5vw,40px);
}
#lesson .swatch{
  width:clamp(76px,9vw,105px);
  height:clamp(76px,9vw,105px);
}
#lesson .pattern{
  width:clamp(88px,10.5vw,120px);
  height:clamp(88px,10.5vw,120px);
}
#lesson .garment{
  transform:scale(.88);
  transform-origin:center;
  margin-top:-6px;
  margin-bottom:-4px;
}
#lesson .help{
  margin-top:10px;
  font-size:clamp(22px,2.7vw,30px);
  line-height:1.12;
  padding:12px 15px;
}
#lesson .correctMsg{
  margin-top:10px;
  font-size:clamp(29px,3.5vw,40px);
  line-height:1;
  padding:12px 16px;
}

/* schermata finale lezione compatta */
#lesson .doneBox{
  margin-top:10px;
  padding:22px;
}
#lesson .doneBox .medal{
  font-size:clamp(70px,9vw,105px);
}
#lesson .doneBox h3{
  font-size:clamp(34px,4.5vw,52px);
  margin:8px 0;
}
#lesson .doneBox p{
  font-size:clamp(23px,2.8vw,32px)!important;
}
#lesson .badge{
  font-size:clamp(24px,2.9vw,33px);
}

/* tablet portrait: 3 risposte restano in una riga quando possibile */
@media (min-width:701px) and (max-width:1000px){
  #lesson .grid{
    grid-template-columns:repeat(3,1fr);
  }
  #lesson .grid.two{
    grid-template-columns:repeat(2,1fr);
  }
  #lesson .option{
    min-height:155px;
    padding:10px;
  }
  #lesson .emoji{
    font-size:68px;
  }
  #lesson .combo{
    font-size:46px;
  }
  #lesson .garment{
    transform:scale(.78);
    margin-top:-14px;
    margin-bottom:-12px;
  }
  #lesson .label{
    font-size:clamp(21px,2.5vw,28px);
    margin-top:4px;
  }
}

/* tablet landscape: ancora più compatto */
@media (min-width:900px){
  #lesson .lessonHead{
    padding:12px 18px;
  }
  #lesson .card{
    padding:13px 16px;
  }
  #lesson .option{
    min-height:145px;
  }
}

/* telefoni: non comprimere troppo */
@media (max-width:700px){
  #lesson .grid,
  #lesson .grid.two{
    grid-template-columns:1fr;
  }
  #lesson .option{
    min-height:180px;
  }
}


/* =========================================================
   TEXT SIZE CONTROLS
   CAMBIA SOLO QUESTI NUMERI PER MODIFICARE LE DIMENSIONI
   Esempio: 42px -> 50px
   ========================================================= */

:root{
  /* ---------- HEADER PRINCIPALE ---------- */
  --txt-logo-title: 42px;          /* ACCADEMIA DI MODA */
  --txt-logo-subtitle: 28px;       /* Diventa una stilista */
  --txt-home-button: 24px;         /* pulsante Torna all'Accademia */

  /* ---------- HOME PAGE ---------- */
  --txt-home-eyebrow: 30px;        /* BENVENUTA IN ACCADEMIA */
  --txt-home-main-title: 72px;      /* Diventa una stilista */
  --txt-home-intro: 40px;           /* testo introduttivo Home */
  --txt-home-progress: 32px;        /* lezioni completate / livello */
  --txt-module-title: 48px;         /* MODULO 1, MODULO 2... */
  --txt-lesson-status: 25px;        /* PRONTA / COMPLETATA */
  --txt-lesson-card-title: 38px;    /* titolo di ogni lezione */
  --txt-lesson-card-desc: 30px;     /* descrizione di ogni lezione */
  --txt-start-button: 29px;         /* pulsante INIZIA / APRI */

  /* ---------- TESTATA DELLA LEZIONE ---------- */
  --txt-lesson-number: 22px;        /* LEZIONE 1 DI 50 */
  --txt-lesson-title: 48px;         /* Il colore nella moda */
  --txt-lesson-subtitle: 29px;      /* sottotitolo lezione */
  --txt-step-pill: 20px;            /* numeri 1 2 3 4 5 */

  /* ---------- CONTENUTO ESERCIZI ---------- */
  --txt-question-title: 38px;       /* titolo domanda: Trova il rosa */
  --txt-question-instruction: 31px; /* istruzione: Tocca il vestito... */
  --txt-answer-label: 27px;         /* ROSA / GIALLO / AZZURRO ecc. */
  --txt-word-answer: 34px;          /* risposte fatte solo di testo */
  --txt-help: 27px;                 /* suggerimento dopo errore */
  --txt-correct: 36px;              /* GIUSTO! */
  --txt-primary-button: 28px;       /* pulsanti generici */

  /* ---------- FINE LEZIONE ---------- */
  --txt-finish-title: 46px;         /* Lezione completata */
  --txt-finish-text: 30px;          /* testo sotto il titolo */
  --txt-badge: 30px;                /* nome del badge */
}

/* =========================================================
   APPLICAZIONE DELLE DIMENSIONI SOPRA
   NON SERVE MODIFICARE QUESTA PARTE
   ========================================================= */

.title h1{font-size:var(--txt-logo-title)!important}
.title div{font-size:var(--txt-logo-subtitle)!important}
.homebtn{font-size:var(--txt-home-button)!important}

#home .hero .eyebrow{font-size:var(--txt-home-eyebrow)!important}
#home .hero h2{font-size:var(--txt-home-main-title)!important}
#home .hero p{font-size:var(--txt-home-intro)!important}
#home .progressTop{font-size:var(--txt-home-progress)!important}
#home .module h2{font-size:var(--txt-module-title)!important}
#home .status{font-size:var(--txt-lesson-status)!important}
#home .lessonCard h3{font-size:var(--txt-lesson-card-title)!important}
#home .lessonCard p{font-size:var(--txt-lesson-card-desc)!important}
#home .primary{font-size:var(--txt-start-button)!important}

#lesson .lessonHead .tag{font-size:var(--txt-lesson-number)!important}
#lesson .lessonHead h2{font-size:var(--txt-lesson-title)!important}
#lesson .lessonHead p{font-size:var(--txt-lesson-subtitle)!important}
#lesson .stepPill{font-size:var(--txt-step-pill)!important}

#lesson .card h3{font-size:var(--txt-question-title)!important}
#lesson .card p{font-size:var(--txt-question-instruction)!important}
#lesson .label{font-size:var(--txt-answer-label)!important}
#lesson .word{font-size:var(--txt-word-answer)!important}
#lesson .help{font-size:var(--txt-help)!important}
#lesson .correctMsg{font-size:var(--txt-correct)!important}
#lesson .primary{font-size:var(--txt-primary-button)!important}

#lesson .doneBox h3{font-size:var(--txt-finish-title)!important}
#lesson .doneBox p{font-size:var(--txt-finish-text)!important}
#lesson .badge{font-size:var(--txt-badge)!important}

/* =========================================================
   LEZIONI COMPLETATE = CARD VERDE
   ========================================================= */
.lessonCard.completed{
  background:linear-gradient(135deg,#e3f6e9,#f3fff6)!important;
  border-color:#8fd3ab!important;
  box-shadow:0 12px 28px rgba(75,130,92,.14)!important;
}
.lessonCard.completed .status{
  background:#c9efd6!important;
  color:#356847!important;
  border-color:#8fd3ab!important;
}

OLORI"], ["emoji", "👗", "LOOK"]]}, {"type": "choice", "title": "Inizia", "text": "Cosa racconti per prima?", "correct": "TEMA", "options": [["emoji", "🎯", "TEMA"], ["emoji", "🍎", "MELA"]], "hint": "Inizia dal TEMA."}, {"type": "choice", "title": "Poi", "text": "Cosa racconti dopo?", "correct": "COLORI", "options": [["emoji", "🎨", "COLORI"], ["emoji", "🚲", "BICI"]], "hint": "Parla dei COLORI."}, {"type": "choice", "title": "Mostra", "text": "Cosa presenti al pubblico?", "correct": "LOOK", "options": [["emoji", "👗", "LOOK"], ["emoji", "🍳", "PENTOLA"]], "hint": "Mostra i LOOK."}, {"type": "choice", "title": "Presentazione", "text": "Quale ordine è corretto?", "correct": "TEMA → COLORI → LOOK", "options": [["combo", "🎯 → 🎨 → 👗", "TEMA → COLORI → LOOK"], ["combo", "🍕 → 🚗 → 🛏️", "PIZZA → AUTO → LETTO"]], "hint": "Scegli TEMA → COLORI → LOOK."}], "module": "Modulo 5 · La mia collezione"}, {"n": 50, "title": "Diploma di Stilista", "subtitle": "Completa il percorso dell’Accademia di Moda.", "badge": "Stilista Diplomata", "steps": [{"type": "intro", "title": "Osserva", "text": "Completa il percorso dell’Accademia di Moda.", "items": [["emoji", "🎨", "COLORI"], ["emoji", "👗", "STILE"], ["emoji", "🏅", "DIPLOMA"]]}, {"type": "choice", "title": "Colori", "text": "Quale competenza hai imparato?", "correct": "COLORI", "options": [["emoji", "🎨", "COLORI"], ["emoji", "🍕", "PIZZA"]], "hint": "Hai imparato i COLORI."}, {"type": "choice", "title": "Stile", "text": "Quale altra competenza hai imparato?", "correct": "STILE", "options": [["emoji", "👗", "STILE"], ["emoji", "🚗", "AUTO"]], "hint": "Hai imparato lo STILE."}, {"type": "choice", "title": "Collezione", "text": "Cosa hai creato alla fine?", "correct": "COLLEZIONE", "options": [["word", "", "COLLEZIONE"], ["word", "", "RICETTA"]], "hint": "Hai creato una COLLEZIONE."}, {"type": "choice", "title": "Diploma", "text": "Quale premio conclude il corso?", "correct": "DIPLOMA", "options": [["emoji", "🏅", "DIPLOMA"], ["emoji", "⚽", "PALLONE"]], "hint": "Il corso si conclude con il DIPLOMA."}], "module": "Modulo 5 · La mia collezione"}];
const moduleOrder=["Modulo 1 · Fondamenti della moda", "Modulo 2 · Stile e abbinamenti", "Modulo 3 · Atelier creativo", "Modulo 4 · Il lavoro della stylist", "Modulo 5 · La mia collezione"];

function bgFor(value){
 const s=(value||"").toLowerCase();
 if(s.includes("rosa"))return "bg-pink"; if(s.includes("azzurro"))return "bg-blue";
 if(s.includes("giallo"))return "bg-yellow"; if(s.includes("rosso"))return "bg-red";
 if(s.includes("arancione"))return "bg-orange"; if(s.includes("viola"))return "bg-purple";
 return "bg-neutral";
}
function garment(color){return `<div class="garment ${color}G"><div class="dress-top"></div><div class="skirt"></div></div>`}
function itemVisual(item){
 const [type,val,label]=item;
 if(type==="dress") return garment(val);
 if(type==="swatch") return `<div class="swatch ${val}"></div>`;
 if(type==="emoji") return `<div class="emoji">${val}</div>`;
 if(type==="combo") return `<div class="combo">${val}</div>`;
 if(type==="word") return `<div class="word">${label}</div>`;
 if(type==="pattern") return `<div class="pattern ${val}"></div>`;
 return "";
}
function renderHome(){
 const host=document.getElementById("modules");host.innerHTML="";
 moduleOrder.forEach(mod=>{
   const section=document.createElement("section");section.className="module";
   const rows=lessons.filter(l=>l.module===mod);
   section.innerHTML=`<h2>${mod}</h2><div class="lessonGrid"></div>`;
   const grid=section.querySelector(".lessonGrid");
   rows.forEach(l=>{
     const done=localStorage.getItem("academy_lesson_"+l.n)==="done";
     const d=document.createElement("div");d.className=done?"lessonCard completed":"lessonCard";
     d.innerHTML=`<span class="status">${done?"Completata ✓":"Pronta"}</span><h3>Lezione ${l.n} · ${l.title}</h3><p>${l.subtitle}</p><button class="primary" onclick="startLesson(${l.n})">${done?"Rifai":"Inizia"}</button>`;
     grid.appendChild(d);
   });
   host.appendChild(section);
 });
 const doneCount=lessons.filter(l=>localStorage.getItem("academy_lesson_"+l.n)==="done").length;
 document.getElementById("progressText").textContent=doneCount+" lezioni completate su 50";
 document.getElementById("fill").style.width=(doneCount/50*100)+"%";
 document.getElementById("levelText").textContent=doneCount>=50?"Stilista Diplomata":doneCount>=40?"Senior Student":doneCount>=25?"Designer":doneCount>=10?"Stylist Junior":"Studentessa";
}
let currentLesson=null,currentStep=0,answerLocked=false;
function goHome(){document.getElementById("lesson").style.display="none";document.getElementById("home").style.display="block";renderHome();window.scrollTo(0,0)}
function startLesson(n){currentLesson=lessons.find(x=>x.n===n);currentStep=0;document.getElementById("home").style.display="none";document.getElementById("lesson").style.display="block";renderStep()}
function renderHead(){
 const pills=currentLesson.steps.map((s,i)=>`<span class="stepPill ${i===currentStep?"on":i<currentStep?"done":""}">${i+1}</span>`).join("");
 document.getElementById("lessonHead").innerHTML=`<div class="tag">LEZIONE ${currentLesson.n} DI 50</div><h2>${currentLesson.title}</h2><p>${currentLesson.subtitle}</p><div class="steps">${pills}</div>`;
}
function renderStep(){
 answerLocked=false;
 renderHead();const s=currentLesson.steps[currentStep];const body=document.getElementById("lessonBody");
 if(!s)return finishLesson();
 if(s.type==="intro"){
  body.innerHTML=`<section class="card"><h3>${currentStep+1}. ${s.title}</h3><p>${s.text}</p><div class="grid">${s.items.map(it=>`<div class="option ${bgFor(it[2])}">${itemVisual(it)}<div class="label">${it[2]}</div></div>`).join("")}</div><button class="primary" style="margin-top:24px" onclick="nextStep()">Continua</button></section>`;
 } else {
  const cls=s.options.length===2?"grid two":"grid";
  body.innerHTML=`<section class="card"><h3>${currentStep+1}. ${s.title}</h3><p>${s.text}</p><div class="${cls}">${s.options.map(it=>`<button class="option ${bgFor(it[2])}" onclick="choose(this,'${String(it[2]).replace(/'/g,"\'")}')">${itemVisual(it)}<div class="label">${it[2]}</div></button>`).join("")}</div><div id="helper" class="help">💡 ${s.hint}</div><div id="correctMsg" class="correctMsg">Giusto! 🎉</div></section>`;
 }
 window.scrollTo(0,0);
}
function choose(el,label){
 if(answerLocked) return;
 const s=currentLesson.steps[currentStep];
 if(label===s.correct){
   answerLocked=true;
   document.querySelectorAll(".option").forEach(b=>{if(b.tagName==="BUTTON") b.disabled=true;});
   el.classList.add("ok");
   document.getElementById("helper").style.display="none";
   document.getElementById("correctMsg").style.display="block";
   setTimeout(()=>{
     currentStep++;
     if(currentStep>=currentLesson.steps.length) finishLesson();
     else renderStep();
   },5000);
 } else {
   document.getElementById("helper").style.display="block";
 }
}
function nextStep(){currentStep++;if(currentStep>=currentLesson.steps.length)finishLesson();else renderStep()}
function finishLesson(){
 renderHead();
 const final = currentLesson.n===50;
 document.getElementById("lessonBody").innerHTML=`<section class="doneBox"><div class="medal">${final?"🎓":"🏅"}</div><h3>${final?"Corso completato":"Lezione completata"}</h3><p style="font-size:22px;font-weight:800">${final?"Hai completato tutte le 50 lezioni dell’Accademia di Moda.":"Hai completato tutte le attività della lezione."}</p><div class="badge">${final?"Diploma: Stilista":"Badge: "+currentLesson.badge}</div><br><br><button class="primary" onclick="completeCurrent()">Torna in Accademia</button></section>`;
}
function completeCurrent(){localStorage.setItem("academy_lesson_"+currentLesson.n,"done");goHome()}
renderHome();
</script>
